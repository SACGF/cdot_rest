user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##

    gzip on;

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;


    server {
        listen 443 ssl;
        add_header Access-Control-Allow-Origin http://129.127.18.77;
        # Agent/API discovery (RFC 8288): point clients at the machine-readable
        # spec, the agent guide and the API catalog. Server-level, so it is
        # inherited by locations that don't set their own add_header.
        add_header Link '</static/openapi.yaml>; rel="service-desc"; type="application/yaml", </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/api-catalog>; rel="api-catalog"' always;
        server_name cdot.cc cdotlib.org 129.127.18.77;
        ssl_certificate /etc/letsencrypt/live/cdotlib.org/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/cdotlib.org/privkey.pem; # managed by Certbot


        location /favicon.ico {
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/favicon.ico;
        }
        location /robots.txt {
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/robots.txt;
        }
        location /llms.txt {
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/llms.txt;
        }
        location /auth.md {
            default_type text/markdown;
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/auth.md;
        }
        location /sitemap.xml {
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/sitemap.xml;
        }
        # RFC 9727 API catalog - linkset pointing at the OpenAPI spec and docs.
        location = /.well-known/api-catalog {
            default_type application/linkset+json;
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/api-catalog.json;
        }
        # Agent Skills discovery (agentskills.io RFC v0.2.0) - the SKILL.md digest
        # in index.json must match the served bytes, so serve the files as-is.
        location = /.well-known/agent-skills/index.json {
            default_type application/json;
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/agent-skills/index.json;
        }
        location = /.well-known/agent-skills/cdotlib-api/SKILL.md {
            default_type text/markdown;
            alias /opt/cdot_rest/cdot_rest/sitestatic/static/agent-skills/cdotlib-api/SKILL.md;
        }

        location /download/ {
            autoindex on;
            root /data/gene_annotation;
        }


        location /static/ {
            autoindex on;
            # The path to the actual project directory here - the one which contains the static/
            # dir holding the static files for this project
            root /opt/cdot_rest/cdot_rest/sitestatic;
        }

        location / {
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header X-Forwarded-Prot $scheme;
            proxy_pass http://localhost:8000/;
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }
        # what to serve if upstream is not available or crashes
        # error_page 500 502 503 504 /static/error_pages/50x.html;

    }


    server {
        if ($host = cdotlib.org) {
            return 301 https://$host$request_uri;
        }
        # managed by Certbot


        listen 80;
        server_name cdot.cc cdotlib.org 129.127.18.77;
        return 404; # managed by Certbot


    }
}
